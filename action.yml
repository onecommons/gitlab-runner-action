name: GitLab Runner Service
description: 'Runs a gitlab runner'
author: 'Ederson Brilhante'
branding:
  icon: 'server'
  color: 'purple'
inputs:
  gitlab-instance:
    description: 'Gitlab instance'
    required: true
    default: 'https://gitlab.com/'
  registration-token:
    description: 'Legacy registration token, or a glrt- token for backward compatibility'
    required: false
  runner-token:
    description: 'Runner authentication token; configure tags and access settings in GitLab'
    required: false
  name:
    description: 'Runner name'
    required: true
  tag-list:
    description: 'Runner tags for legacy registration tokens; ignored with authentication tokens'
    required: false
  docker-image:
    description: 'Docker image used by runner'
    required: false
    default: 'docker:28.5.1'
  runner-image:
    description: 'GitLab Runner image; set a version or digest to pin it'
    required: false
    default: 'gitlab/gitlab-runner:latest'
  docker-privileged:
    description: 'Run Docker executor job and service containers in privileged mode'
    required: false
    default: 'true'
  network-per-build:
    description: 'Create a separate Docker network for each GitLab job'
    required: false
    default: 'false'
  run-untagged:
    description: "Parameter that allows or not to pick untagged jobs"
    required: false
    default: 'true'
  access-level:
    description: 'Parameter to create or not a protected runner'
    required: false
    default: "not_protected"
  concurrent:
    description: 'Maximum number of jobs that can run concurrently'
    required: false
    default: '4'
  timeout:
    description: 'Timeout in seconds for how long the runner should stay active (ignored if exit-after-job is true)'
    required: false
    default: '3600'
  exit-after-job:
    description: 'Exit after first job completes instead of waiting for timeout'
    required: false
    default: 'false'
runs:
  using: 'node24'
  main: 'dist/index.js'
  post: 'dist/post/index.js'
  post-if: 'always()'
